<!DOCTYPE html>
<html>
<head>
    <title>H4X IOS ADMIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between mb-8">
            <h1 class="text-3xl font-bold text-blue-500 italic">H4X IOS CONTROL</h1>
            <button onclick="toggleMaint()" class="px-6 py-2 rounded bg-{% if db.maintenance %}red{% else %}green{% endif %}-600">
                {% if db.maintenance %}OFF MAINTENANCE{% else %}ON MAINTENANCE{% endif %}
            </button>
        </div>

        <div class="bg-gray-800 p-6 rounded-xl mb-6">
            <button onclick="genKey()" class="bg-blue-600 px-4 py-2 rounded font-bold">+ GEN NEW KEY</button>
        </div>

        <table class="w-full bg-gray-800 rounded-xl overflow-hidden">
            <thead class="bg-gray-700">
                <tr>
                    <th class="p-4 text-left">License Key</th>
                    <th class="p-4 text-left">IP Address</th>
                    <th class="p-4 text-left">Status</th>
                </tr>
            </thead>
            <tbody>
                {% for key, data in db.keys.items() %}
                <tr class="border-b border-gray-700">
                    <td class="p-4 font-mono text-blue-400">{{ key }}</td>
                    <td class="p-4">{{ data.ip if data.ip else "Pending..." }}</td>
                    <td class="p-4">Active</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <script>
        function toggleMaint() { fetch('/api/admin/maintenance', {method:'POST'}).then(()=>location.reload()); }
        function genKey() { fetch('/api/admin/generate', {method:'POST'}).then(r=>r.json()).then(d=>alert("Key: "+d.key)); }
    </script>
</body>
</html>
